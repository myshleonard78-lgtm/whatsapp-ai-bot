<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Strategy Builder — Trading Desk</title>
<link rel="stylesheet" href="styles.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<nav class="sidebar">
  <div class="brand">Ledger</div>
  <div class="brand-sub">Mysh's Trading Desk</div>
  <div class="nav">
    <a href="overview.html">Overview</a>
    <a href="positions.html">Positions</a>
    <a href="strategies.html">Strategies</a>
    <a href="builder.html" class="active">Strategy Builder</a>
    <a href="history.html">History</a>
  </div>
  <div class="sidebar-footer">
    <div><span class="live-dot" id="sidebarDot"></span><span class="muted">Status</span></div>
    <div class="sidebar-status" id="sidebarStatus">Loading…</div>
  </div>
</nav>

<main class="main">
  <h1 class="page-title">Strategy Builder</h1>

  <!-- Step 1: market type + symbol -->
  <div class="card" id="setupCard">
    <h2>1. What market type?</h2>
    <div class="market-type-row" id="marketTypeRow">
      <button class="type-btn" data-type="Rise/Fall">Rise / Fall</button>
      <button class="type-btn" data-type="Over/Under">Over / Under</button>
      <button class="type-btn" data-type="Matches/Differs">Matches / Differs</button>
      <button class="type-btn" data-type="Even/Odd">Even / Odd</button>
      <button class="type-btn" data-type="Other">Other</button>
    </div>
    <div style="margin-top:16px;">
      <label class="muted" style="margin-right:10px;">Symbol</label>
      <select id="symbolSelect">
        <option value="R_10">Volatility 10</option>
        <option value="R_25">Volatility 25</option>
        <option value="R_50">Volatility 50</option>
        <option value="R_75">Volatility 75</option>
        <option value="R_100" selected>Volatility 100</option>
      </select>
    </div>
  </div>

  <!-- Live visualization, shown once a type is picked -->
  <div class="card" id="vizCard" style="display:none; margin-top:14px;">
    <h2 id="vizTitle">Live market</h2>
    <div id="chartWrap"><canvas id="simChart" style="max-height:220px;"></canvas></div>
    <div id="digitWrap" class="digit-grid" style="display:none;"></div>
    <div class="muted" id="vizNote" style="margin-top:10px;"></div>
  </div>

  <!-- Chat, shown once a type is picked -->
  <div class="card" id="chatCard" style="display:none; margin-top:14px;">
    <h2>2. Explain your strategy</h2>
    <div class="chat-log" id="chatLog"></div>
    <div id="proposalArea"></div>
    <div class="chat-input-row">
      <input id="chatInput" type="text" placeholder="Describe your strategy while watching the data above..." onkeydown="if(event.key==='Enter') sendChat()" />
      <button class="primary" onclick="sendChat()">Send</button>
    </div>
  </div>
</main>

<script src="app.js"></script>
<script>
let marketType = null, symbol = 'R_100';
let simChart, vizInterval;
const chatConversationId = 'dashboard-' + Date.now();
let lastProposal = null;

document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => selectMarketType(btn.dataset.type));
});
document.getElementById('symbolSelect').addEventListener('change', (e) => {
  symbol = e.target.value;
  if (marketType) startVisualization();
});

function selectMarketType(type) {
  marketType = type;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === type));
  document.getElementById('vizCard').style.display = 'block';
  document.getElementById('chatCard').style.display = 'block';
  document.getElementById('vizTitle').textContent = type === 'Other' ? 'No live preview for this type' : `Live: ${type} on ${symbol}`;

  if (vizInterval) clearInterval(vizInterval);

  if (type === 'Rise/Fall') {
    document.getElementById('chartWrap').style.display = 'block';
    document.getElementById('digitWrap').style.display = 'none';
    document.getElementById('vizNote').textContent = 'This is the real, live price feed — not a simulation — so what you see matches the actual market as you describe your strategy.';
    startVisualization();
  } else if (['Over/Under','Matches/Differs','Even/Odd'].includes(type)) {
    document.getElementById('chartWrap').style.display = 'none';
    document.getElementById('digitWrap').style.display = 'grid';
    document.getElementById('vizNote').textContent = 'Last-digit frequency over the most recent 1000 ticks. Green = most frequent, blue = 2nd most, yellow = 2nd least, red = least frequent.';
    startVisualization();
  } else {
    document.getElementById('vizCard').style.display = 'none';
    document.getElementById('vizNote').textContent = '';
  }

  if (!document.getElementById('chatLog').childElementCount) {
    addChatMsg(`Got it — designing a ${type} strategy on ${symbol}. Tell me what you're looking for.`, 'ai');
  }
}

function startVisualization() {
  if (vizInterval) clearInterval(vizInterval);
  if (marketType === 'Rise/Fall') {
    refreshChart();
    vizInterval = setInterval(refreshChart, 3000);
  } else if (['Over/Under','Matches/Differs','Even/Odd'].includes(marketType)) {
    refreshDigits();
    vizInterval = setInterval(refreshDigits, 5000);
  }
}

async function refreshChart() {
  try {
    const res = await fetch(`/market-ticks?symbol=${symbol}&count=100`);
    const d = await res.json();
    const labels = d.prices.map((_, i) => i);
    if (!simChart) {
      simChart = new Chart(document.getElementById('simChart'), {
        type: 'line',
        data: { labels, datasets: [{ data: d.prices, borderColor: '#c99248', pointRadius: 0, tension: 0.15 }] },
        options: { plugins:{legend:{display:false}}, scales:{x:{display:false}, y:{ticks:{color:'#8b93a0', font:{family:'IBM Plex Mono'}}, grid:{color:'#2b3542'}}} }
      });
    } else {
      simChart.data.labels = labels;
      simChart.data.datasets[0].data = d.prices;
      simChart.update('none');
    }
  } catch (e) { console.error('chart refresh failed', e); }
}

async function refreshDigits() {
  try {
    const res = await fetch(`/market-digit-stats?symbol=${symbol}&count=1000`);
    const d = await res.json();
    const wrap = document.getElementById('digitWrap');
    wrap.innerHTML = '';
    d.digits.forEach(x => {
      const ring = x.rank === 'most' ? 'ring-green' : x.rank === '2nd-most' ? 'ring-blue' : x.rank === '2nd-least' ? 'ring-yellow' : x.rank === 'least' ? 'ring-red' : 'ring-none';
      const el = document.createElement('div');
      el.className = 'digit-circle ' + ring;
      el.innerHTML = `<div class="digit-num">${x.digit}</div><div class="digit-pct">${x.pct}%</div>`;
      wrap.appendChild(el);
    });
  } catch (e) { console.error('digit refresh failed', e); }
}

function addChatMsg(text, who) {
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if (!message) return;
  addChatMsg(message, 'user');
  input.value = '';

  const res = await fetch('/strategy-chat', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ conversationId: chatConversationId, message, marketType, symbol })
  });
  const data = await res.json();
  addChatMsg(data.reply, 'ai');

  const area = document.getElementById('proposalArea');
  if (data.proposal) {
    lastProposal = data.proposal;
    const p = data.proposal;
    area.innerHTML = `
      <div class="proposal-box">
        <strong class="serif">${p.id}</strong>
        <div>${p.description}</div>
        <div class="mono muted">Symbol: ${p.symbol || symbol}</div>
        ${p.buyOperator ? `<div class="mono">Buy when RSI ${p.buyOperator} ${p.buyValue}</div>` : ''}
        ${p.sellOperator ? `<div class="mono">Sell when RSI ${p.sellOperator} ${p.sellValue}</div>` : ''}
        <div style="margin-top:10px;">
          <button class="primary" onclick="confirmStrategy()">Start testing this strategy</button>
        </div>
      </div>`;
  }
}

async function confirmStrategy() {
  if (!lastProposal) return;
  const res = await fetch('/strategy-confirm', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ proposal: lastProposal })
  });
  const data = await res.json();
  if (data.ok) {
    addChatMsg(`"${lastProposal.id}" is now live on demo and being tested.`, 'ai');
    document.getElementById('proposalArea').innerHTML = '';
    lastProposal = null;
  } else {
    addChatMsg('Failed to add that strategy: ' + (data.error?.error || JSON.stringify(data.error)), 'ai');
  }
}
</script>
</body>
</html>
