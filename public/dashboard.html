<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trading Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0f14; --card: #131a22; --border: #1f2a35; --text: #e6edf3;
    --muted: #8b98a5; --green: #3fb950; --red: #f85149; --yellow: #d29922; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: -apple-system, system-ui, sans-serif; padding:16px; }
  h1 { font-size:18px; margin:0 0 16px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap:12px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin:0 0 8px; }
  .big { font-size:24px; font-weight:600; }
  .row { display:flex; justify-content:space-between; align-items:center; margin:6px 0; font-size:14px; }
  .badge { padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .badge.green { background:rgba(63,185,80,0.15); color:var(--green); }
  .badge.red { background:rgba(248,81,73,0.15); color:var(--red); }
  .badge.yellow { background:rgba(210,153,34,0.15); color:var(--yellow); }
  .badge.blue { background:rgba(88,166,255,0.15); color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:500; }
  .pnl-pos { color:var(--green); } .pnl-neg { color:var(--red); }
  .bar-track { background:#1f2a35; border-radius:6px; height:8px; overflow:hidden; margin-top:6px; }
  .bar-fill { background:var(--accent); height:100%; }
  button { background:var(--card); border:1px solid var(--border); color:var(--text); padding:8px 14px; border-radius:8px; cursor:pointer; font-size:13px; margin-right:8px; }
  button.danger { border-color:var(--red); color:var(--red); }
  button.primary { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .muted { color:var(--muted); font-size:12px; }
  canvas { max-height:160px; }
</style>
</head>
<body>
<h1>🤖 Forex Trading Bot — Live Dashboard</h1>

<div class="grid">
  <div class="card">
    <h2>Status</h2>
    <div class="row"><span>Mode</span><span id="mode" class="badge blue">—</span></div>
    <div class="row"><span>Connection</span><span id="conn" class="badge">—</span></div>
    <div class="row"><span>Trading</span><span id="halted" class="badge">—</span></div>
    <div style="margin-top:10px;">
      <button class="danger" onclick="control('halt')">Halt</button>
      <button class="primary" onclick="control('resume')">Resume</button>
    </div>
    <div style="margin-top:8px;">
      <button onclick="control('mode','demo')">Switch to Demo</button>
      <button onclick="control('mode','live')">Switch to Live</button>
    </div>
  </div>

  <div class="card">
    <h2>Balance & Risk</h2>
    <div class="big" id="balance">—</div>
    <div class="row"><span>Today's loss</span><span id="todaysLoss">—</span></div>
    <div class="row"><span>Daily cap</span><span id="dailyCap">—</span></div>
    <div class="bar-track"><div class="bar-fill" id="lossBar" style="width:0%; background:var(--red);"></div></div>
    <div class="row" style="margin-top:8px;"><span>Risk per trade</span><span id="riskPct">—</span></div>
  </div>

  <div class="card">
    <h2>Equity</h2>
    <canvas id="equityChart"></canvas>
  </div>
</div>

<div class="card" style="margin-bottom:16px;">
  <h2>Open Positions</h2>
  <table id="positionsTable">
    <thead><tr><th>Type</th><th>Symbol</th><th>Stake</th><th>Payout</th><th>Expires</th></tr></thead>
    <tbody></tbody>
  </table>
  <div class="muted" id="noPositions" style="display:none;">No open positions right now.</div>
</div>

<div class="grid" id="strategyCards"></div>

<div class="muted" id="updatedAt" style="margin-top:16px;"></div>

<script>
let equityChart;
const equityPoints = [];

function fmt(n) { return typeof n === 'number' ? '$' + n.toFixed(2) : '—'; }

function setBadge(el, text, cls) {
  el.textContent = text;
  el.className = 'badge ' + cls;
}

async function control(action, mode) {
  if (!confirm(`Confirm: ${action}${mode ? ' → ' + mode : ''}?`)) return;
  const res = await fetch('/trading-control', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ action, mode })
  });
  if (!res.ok) alert('Action failed — check logs.');
  refresh();
}

function renderPositions(positions) {
  const tbody = document.querySelector('#positionsTable tbody');
  tbody.innerHTML = '';
  document.getElementById('noPositions').style.display = positions.length ? 'none' : 'block';
  positions.forEach(p => {
    const tr = document.createElement('tr');
    const expiresIn = Math.max(0, Math.round(p.expiry_time - Date.now()/1000));
    tr.innerHTML = `<td>${p.contract_type || '—'}</td><td>${p.underlying_symbol || '—'}</td>
      <td>$${(p.buy_price||0).toFixed(2)}</td><td>$${(p.payout||0).toFixed(2)}</td>
      <td>${expiresIn}s</td>`;
    tbody.appendChild(tr);
  });
}

function renderStrategies(strategies) {
  const container = document.getElementById('strategyCards');
  container.innerHTML = '';
  strategies.forEach(s => {
    const pct = Math.min(100, (s.tradeCount / s.gateMinTrades) * 100);
    const statusCls = s.status === 'promoted' ? 'green' : s.status === 'discarded' ? 'red' : 'blue';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h2>${s.strategyId} <span class="badge ${statusCls}" style="float:right;">${s.status}</span></h2>
      <div class="row"><span>Trades</span><span>${s.tradeCount} / ${s.gateMinTrades}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="row" style="margin-top:8px;"><span>Win rate</span><span>${s.winRatePct}% (need ${s.gateMinWinRatePct}%)</span></div>
      <div class="row"><span>Profit factor</span><span>${s.profitFactor ?? '∞'} (need ${s.gateMinProfitFactor})</span></div>
      <div class="row"><span>Drawdown</span><span>${s.drawdownPct}%</span></div>
    `;
    container.appendChild(card);
  });
}

function updateEquityChart(balance) {
  equityPoints.push(balance);
  if (equityPoints.length > 50) equityPoints.shift();
  if (!equityChart) {
    equityChart = new Chart(document.getElementById('equityChart'), {
      type: 'line',
      data: { labels: equityPoints.map((_,i)=>i), datasets: [{ data: equityPoints, borderColor: '#58a6ff', tension: 0.3, pointRadius: 0 }] },
      options: { plugins:{legend:{display:false}}, scales:{x:{display:false}, y:{ticks:{color:'#8b98a5'}}} }
    });
  } else {
    equityChart.data.labels = equityPoints.map((_,i)=>i);
    equityChart.data.datasets[0].data = equityPoints;
    equityChart.update('none');
  }
}

async function refresh() {
  try {
    const res = await fetch('/trading-data');
    const d = await res.json();

    setBadge(document.getElementById('mode'), d.mode.toUpperCase(), d.mode === 'live' ? 'red' : 'blue');
    setBadge(document.getElementById('conn'), d.connected ? 'Connected' : 'Disconnected', d.connected ? 'green' : 'red');
    setBadge(document.getElementById('halted'), d.halted ? 'Halted' : 'Active', d.halted ? 'yellow' : 'green');

    document.getElementById('balance').textContent = fmt(d.balance);
    document.getElementById('todaysLoss').textContent = fmt(d.todaysLoss);
    document.getElementById('dailyCap').textContent = fmt(d.dailyLossLimit);
    document.getElementById('riskPct').textContent = d.riskPerTradePct + '%';
    document.getElementById('lossBar').style.width = Math.min(100, (d.todaysLoss / d.dailyLossLimit) * 100) + '%';

    renderPositions(d.openPositions || []);
    renderStrategies(d.strategies || []);
    updateEquityChart(d.balance);

    document.getElementById('updatedAt').textContent = 'Last updated: ' + new Date(d.updatedAt).toLocaleTimeString();
  } catch (err) {
    console.error('refresh failed', err);
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
